[project]
name = "xong"
version = "0.2.0"
description = "A calm, self-hosted task system for people and AI agents"
readme = "README.md"
authors = [{ name = "Nicolas Koehl" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "alembic",
    "psycopg[binary]",
    "jinja2",
    "mcp==2.0.0",
    "python-multipart",
    "pyjwt[crypto]",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
]

[project.scripts]
xong = "xong.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xong"]

[tool.hatch.build.targets.wheel.sources]
"src/xong" = "xong"

[tool.hatch.build.targets.sdist]
include = ["src/xong", "alembic", "alembic.ini", "README.md", "SPEC.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
