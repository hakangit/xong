<!DOCTYPE html>

<head>

<div id="app">
  <!-- desktop sidebar -->
  <nav class="side" aria-label="Navigation">
    <div class="brand">Xong<em>.</em></div>
    <button class="nav-btn on" data-view="today">Hôm nay</button>
    <button class="nav-btn" data-view="lists">Danh sách</button>
    <button class="nav-btn" data-view="recap">Tuần này</button>
    <div class="spacer"></div>
    <div class="side-tools">
      <div class="lang-switch">
        <button data-lang="vi">VI</button><span>·</span><button data-lang="en">EN</button><span>·</span><button data-lang="zh">中</button>
      </div>
      <button class="mute-btn" aria-label="Mute">🔊</button>
    </div>
  </nav>

  <main>
    <div class="topbar topbar-mobile-only">
      <div class="brand">Xong<em>.</em></div>
      <div class="topbar-tools">
        <div class="lang-switch">
          <button data-lang="vi">VI</button><span>·</span><button data-lang="en">EN</button><span>·</span><button data-lang="zh">中</button>
        </div>
        <button class="mute-btn" aria-label="Mute">🔊</button>
      </div>
    </div>
    <div id="view" aria-live="polite"></div>
  </main>

  <!-- mobile tab bar -->
  <nav class="tabs" aria-label="Navigation">
    <button class="nav-btn on" data-view="today">Hôm nay</button>
    <button class="nav-btn" data-view="lists">Danh sách</button>
    <button class="nav-btn" data-view="recap">Tuần này</button>
  </nav>
</div>

<div id="toast" role="status"></div>
